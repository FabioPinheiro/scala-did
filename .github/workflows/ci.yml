name: CI
run-name: CI on ${{ github.ref_name }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  build-test:
    name: Build and package Sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java and Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: openjdk@1.17.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Setup Scala.JS
        uses: japgolly/setup-scalajs@v1
      - name: Cache sbt
        uses: coursier/cache-action@v7
      - name: Install npm dependencies
        run: npm ci
      - name: Scalafmt
        run: sbt -v scalafmtCheckAll
      - name: Compile and test JVM and Scala.js projects
        run: SKIP_INTEGRATION_TEST=true sbt -v compile test
      - name: Link serviceworker and webapp
        run: sbt -v fullPackAll
      - name: Build Vite frontend
        run: npm run build
      - name: Assemble demo server
        run: sbt -v backend/assembly
      - name: Build demo image
        run: docker build -t scala-did-sandbox -f backend/Dockerfile backend
      - name: Smoke test
        run: docker compose -f backend/compose.test.yml up --wait --wait-timeout 70
      - name: Collect logs and clean up
        if: always()
        run: |
          docker compose -f backend/compose.test.yml logs
          docker compose -f backend/compose.test.yml down --volumes
