name: CI
run-name: CI on ${{ github.ref_name }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-test:
    name: Build, bundle, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java and Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: openjdk@1.17.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Setup Scala.js
        uses: japgolly/setup-scalajs@v1
      - name: Cache sbt
        uses: coursier/cache-action@v7
      - name: Install CIP-30 dependencies
        run: npm --prefix cardano-prism-cip30-webapp ci
      - name: Scalafmt
        run: sbt -v scalafmtCheckAll
      - name: Compile and test
        run: sbt -v "compile;test"
      - name: Link, bundle, and assemble
        run: sbt -v cardanoPrismCli/assembly
      - name: Verify embedded CIP-30 bundle and CLI
        run: |
          unzip -Z1 cardano-prism-cli/target/scala-3.3.8/cardano-prism.jar | grep -Fx cip30/bundle.js
          unzip -Z1 cardano-prism-cli/target/scala-3.3.8/cardano-prism.jar | grep -Fx cip30/bundle.js.map
          java -jar cardano-prism-cli/target/scala-3.3.8/cardano-prism.jar --help
          java -jar cardano-prism-cli/target/scala-3.3.8/cardano-prism.jar version

  publish:
    name: Publish CLI artifact
    needs: build-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Java and Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: openjdk@1.17.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Setup Scala.js
        uses: japgolly/setup-scalajs@v1
      - name: Cache sbt
        uses: coursier/cache-action@v7
      - name: Publish
        run: sbt -v ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
